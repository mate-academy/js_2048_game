<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <link rel="stylesheet" href="./styles/main.scss"/>
  </head>
  <body>

    <!-- ── Menu overlay ─────────────────────────────────────────────────── -->
    <div class="menu" id="menu"
     aria-hidden="true">
      <div class="menu__backdrop" id="menuBackdrop"></div>
      <div class="menu__panel" role="dialog"
       aria-label="Game menu">
        <div class="menu__header">
          <span class="menu__title">Menu</span>
          <button class="icon-btn" id="menuClose"
           aria-label="Close menu">✕</button>
        </div>
        <nav class="menu__items">
          <button class="menu-item" data-action="standard">
            <span class="menu-item__title">⭐ Standard</span>
            <span class="menu-item__desc">2048 with powerups — 3 uses each</span>
          </button>
          <button class="menu-item" data-action="tutorial">
            <span class="menu-item__title">📖 Tutorial</span>
            <span class="menu-item__desc">Learn how to play 2048</span>
          </button>
          <button class="menu-item menu-item--disabled" disabled>
            <span class="menu-item__title">✨ Extra</span>
            <span class="menu-item__desc">Coming soon…</span>
          </button>
        </nav>
        <div class="menu__footer">
          Hold <kbd>Shift</kbd> to see powerup tips.
        </div>
      </div>
    </div>

    <!-- ── Tutorial overlay ──────────────────────────────────────────────── -->
    <div class="overlay hidden" id="tutorial">
      <div class="panel tut-panel">
        <div class="tut-header">
          <span class="tut-title">Tutorial <span class="tut-counter" id="tutCounter">1/6</span></span>
          <button class="icon-btn" id="tutClose"
          aria-label="Close tutorial">✕</button>
        </div>

        <!-- Mini board -->
        <div class="mini-board" id="miniBoard"></div>

        <!-- Step content -->
        <div class="tut-body">
          <div class="tut-step-title" id="tutStepTitle"></div>
          <div class="tut-step-text"  id="tutStepText"></div>
        </div>

        <!-- Dots -->
        <div class="tut-dots" id="tutDots"></div>

        <!-- Navigation -->
        <div class="tut-nav" id="tutNav"></div>
      </div>
    </div>

    <!-- ── Main app ───────────────────────────────────────────────────────── -->
    <div class="app">
      <main class="container">

        <!-- Topbar -->
        <header class="topbar">
          <div class="topbar__left">
            <button class="icon-btn burger-btn" id="menuOpen"
             aria-label="Open menu">
              <svg width="18" height="13"
               viewBox="0 0 18 13"
               fill="none"
               aria-hidden="true">
                <rect y="0"   width="18"
                height="2"
                 rx="1"
                 fill="rgba(119,110,101,.85)"/>
                <rect y="5.5" width="18"
                height="2"
                 rx="1"
                 fill="rgba(119,110,101,.85)"/>
                <rect y="11"  width="18"
                height="2"
                 rx="1"
                 fill="rgba(119,110,101,.85)"/>
              </svg>
            </button>
            <div class="brand">2048</div>
          </div>
          <div class="topbar__right">
            <div class="scoreboard">
              <div class="scorebox">
                <div class="scorebox__label">SCORE</div>
                <div class="scorebox__value" id="score">0</div>
              </div>
              <div class="scorebox">
                <div class="scorebox__label">BEST</div>
                <div class="scorebox__value" id="best">0</div>
              </div>
            </div>
            <button class="btn btn--primary" id="newGame">New Game</button>
          </div>
        </header>

        <!-- Play area -->
        <section class="play-area">

          <!-- Board -->
          <div class="board" id="board">
            <div class="board__grid"  id="boardGrid"></div>
            <div class="board__tiles" id="boardTiles"></div>
          </div>

          <!-- Powerups -->
          <div class="powerups" id="powerups">
            <button class="powerup" data-powerup="undo"
               disabled>
              <span class="powerup__tip">Revert your last move<br><span class="tip-uses" data-powerup="undo"></span></span>
              <span class="powerup__icon">↶</span>
              <span class="powerup__label">Undo</span>
              <span class="powerup__pips" data-powerup="undo"></span>
            </button>
            <button class="powerup" data-powerup="delete"
             disabled>
              <span class="powerup__tip">Remove one random tile<br><span class="tip-uses" data-powerup="delete"></span></span>
              <span class="powerup__icon">⌫</span>
              <span class="powerup__label">Delete</span>
              <span class="powerup__pips" data-powerup="delete"></span>
            </button>
            <button class="powerup" data-powerup="shuffle"
            disabled>
              <span class="powerup__tip">Randomise tile positions<br><span class="tip-uses" data-powerup="shuffle"></span></span>
              <span class="powerup__icon">⧉</span>
              <span class="powerup__label">Shuffle</span>
              <span class="powerup__pips" data-powerup="shuffle"></span>
            </button>
          </div>

        </section>

        <!-- Status message -->
        <div class="msg-wrap">
          <div class="msg msg--neutral" id="msgIdle">
            Press <strong>New Game</strong> to begin, or
            <span class="msg-link" id="msgTutLink">open the Tutorial</span>.
          </div>
          <div class="msg msg--gold   hidden" id="msgWin">🎉 You reached 2048! Keep going for a higher score!</div>
          <div class="msg msg--red    hidden" id="msgLose">No more moves! Press <strong>Restart</strong> to try again.</div>
        </div>

      </main>
    </div>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
