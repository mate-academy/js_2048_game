<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048 Game</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <main class="container">
      <header class="game-header">
        <h1>2048</h1>

        <div class="controls">
          <div class="info">
            Score:
            <span class="game-score">0</span>
          </div>

          <button
            class="button start"
            type="button"
          >
            Start
          </button>
        </div>
      </header>

      <table class="game-field">
        <tbody>
          <tr>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
          </tr>
          <tr>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
          </tr>
          <tr>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
          </tr>
          <tr>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
            <td class="field-cell"></td>
          </tr>
        </tbody>
      </table>

      <div class="message-container">
        <p class="message message-start">
          Press "Start" to begin game. Good luck!
        </p>

        <p class="message message-win hidden">Winner! Congrats! You did it!</p>

        <p class="message message-lose hidden">You lose! Restart the game?</p>
      </div>
    </main>

    <script
      type="module"
      src="./scripts/main.js"
    ></script>
  </body>
</html>
