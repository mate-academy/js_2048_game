<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048 Neon Glass</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@700;900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container">
      <div class="game-header">
        <div class="logo-box">
          <h1>2048</h1>
        </div>

        <div class="controls">
          <div class="info-box">
            <span class="info-label">SCORE</span>
            <span class="game-score">0</span>
          </div>
          <button class="button start">START</button>
        </div>
      </div>

      <div class="game-field-wrapper">
        <table class="game-field">
          <tbody>
            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>

            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>

            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>

            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>
          </tbody>
        </table>
        <div class="tiles-container"></div>

        <div class="message-overlay message-win hidden">
          <h2 class="neon-text magenta">Congratulations!</h2>
          <p>You reached 2048!</p>
        </div>

        <div class="message-overlay message-lose hidden">
          <h2 class="neon-text red">Game Over</h2>
          <p>You lose! Restart the game?</p>
        </div>

        <div class="message-overlay message-start">
          <h2 class="neon-text cyan">Press Start</h2>
          <p>Controls: Arrow keys or WASD</p>
        </div>
      </div>
    </div>
    <script
      type="module"
      src="scripts/main.js"
    ></script>
  </body>
</html>
