<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <div class="container">
      <div class="game-header">
        <h1>2048</h1>
        <div class="controls">
          <p class="info">
            Top
            <br />
            score:
            <span class="best-score">0</span>
          </p>
          <p class="info">
            Score:
            <span class="game-score">0</span>
          </p>
          <button class="button restart start">Start</button>
        </div>
      </div>
      <div class="board-wrapper">
        <table class="game-field">
          <tbody>
            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>

            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>

            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>

            <tr class="field-row">
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
              <td class="field-cell"></td>
            </tr>
          </tbody>
        </table>

        <div class="message message-start">
          <p>Press "Start" to begin game</p>
        </div>

        <div class="message message-lose hidden">
          <p>You lose! Restart the game?</p>
          <button class="button btn-overlay">Try Again</button>
        </div>

        <div class="message message-win hidden">
          <p>Winner! Congrats! You did it!</p>
          <button class="button btn-overlay">Try Again</button>
        </div>
      </div>
    </div>
    <script
      src="scripts/main.js"
      type="module"
    ></script>
  </body>
</html>
