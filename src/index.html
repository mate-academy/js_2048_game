<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="game-score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="game-best">0</span>
        </div>
      </div>
      <div>
        <button class="button button-retry">Restart</button>
      </div>
    </header>

    <div class="game">
      <div class="field">
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
        <div class="blank"></div>
      </div>

      <div class="tiles"></div>

      <div class="message message-loss hidden">
        <p>Game over!</p>
        <button class="button button-retry">Try again</button>
      </div>

      <div class="message message-win hidden">
        <p>You won!!!!</p>
        <button class="button button-continue">Continue</button>
      </div>
    </div>
    <script
      type="module"
      src="scripts/main.js"
    ></script>
  </body>
</html>
