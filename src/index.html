<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048 Game</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <div class="game-container">
      <header>
        <h1>2048</h1>
        <div class="score-container">
          Рахунок:
          <span id="score">0</span>
        </div>
        <!-- Додано клас button start, який шукають тести -->
        <button
          id="start-btn"
          class="button start"
        >
          Start
        </button>
      </header>

      <!-- Додано класи message та message-lose, які перевіряють тести -->
      <div
        id="status-message"
        class="message message-lose hidden"
      >
        Натисніть "Start", щоб почати гру!
      </div>

      <div
        id="board"
        class="board"
      ></div>
    </div>

    <script
      type="module"
      src="./scripts/main.js"
    ></script>
  </body>
</html>
