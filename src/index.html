<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <div class="container">
      <header class="game-header">
        <h1>2048</h1>

        <div class="controls">
          <div class="info">
            <span>Score</span>
            <span class="game-score">0</span>
          </div>

          <button
            class="button start"
            type="button"
          >
            Start
          </button>
          <button
            class="button restart"
            type="button"
          >
            Restart
          </button>
        </div>
      </header>

      <div class="message hidden"></div>

      <table class="game-field">
        <tbody id="board"></tbody>
      </table>
    </div>

    <script
      type="module"
      src="./scripts/main.js"
    ></script>
  </body>
</html>
