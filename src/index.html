<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 Game</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="game-header">
        <h1>2048</h1>
        <div class="scores">
          <div class="info">
            <div>Score</div>
            <div class="game-score">0</div>
          </div>
          <div class="controls">
            <button class="button start">Start</button>
          </div>
        </div>
      </div>

      <div class="game-container">
        <div class="message-container">
          <div class="message message-start">
            <p>Click Start to play!</p>
            <p>Use arrow keys to move tiles.</p>
          </div>
          <div class="message message-win hidden">
            <p>You Win! 🎉</p>
            <p>Click Restart to play again.</p>
          </div>
          <div class="message message-lose hidden">
            <p>Game Over! 😢</p>
            <p>Click Restart to try again.</p>
          </div>
        </div>

        <table class="game-field">
          <tbody>
            <tr>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
            </tr>
            <tr>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
            </tr>
            <tr>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
            </tr>
            <tr>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
              <td class="field-cell field-cell--0"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
