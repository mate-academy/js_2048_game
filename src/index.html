<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <div class="container">
      <div class="game-header">
        <h1 class="title">2048</h1>
        <div class="controls">
          <p class="info">
            Score:
            <span class="game-score">0</span>
          </p>
          <button class="button start">Start</button>
        </div>
      </div>

      <table class="game-field">
        <tbody></tbody>
      </table>

      <div class="footer">
        <div class="message-container">
          <p class="message message-lose hidden">You lose! Restart the game?</p>
          <p class="message message-win hidden">
            Winner! Congrats! You did it!
          </p>
          <p class="message message-start">
            Press "Start" to begin game. Good luck!
          </p>
        </div>
        <div class="message-container">
          <p class="message message-start">
            Choose field size
            <input
              type="number"
              class="message input"
              value="4"
              min="4"
              max="9"
              step="1"
            />
          </p>
        </div>
      </div>
    </div>
    <script
      src="scripts/main.js"
      type="module"
    ></script>
  </body>
</html>
