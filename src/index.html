<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>2048 — Demo</title>

    <link
      rel="stylesheet"
      href="styles/main.css"
    />
  </head>
  <body>
    <div class="game">
      <div class="controls">
        <button
          id="mainButton"
          class="button start"
        >
          Start
        </button>
        <div class="score">
          Score:
          <span
            id="score"
            class="game-score"
          >
            0
          </span>
        </div>
      </div>

      <div class="messages">
        <span
          id="startMessage"
          class="message"
        >
          Press Start or use arrow keys to begin
        </span>
        <span
          id="winMessage"
          class="message hidden"
        >
          You win! 🎉
        </span>
        <span
          id="gameOverMessage"
          class="message hidden"
        >
          You lose! Restart the game?
        </span>
      </div>

      <div
        id="board"
        class="board"
      >
        <div
          class="cell"
          data-row="0"
          data-col="0"
        ></div>
        <div
          class="cell"
          data-row="0"
          data-col="1"
        ></div>
        <div
          class="cell"
          data-row="0"
          data-col="2"
        ></div>
        <div
          class="cell"
          data-row="0"
          data-col="3"
        ></div>

        <div
          class="cell"
          data-row="1"
          data-col="0"
        ></div>
        <div
          class="cell"
          data-row="1"
          data-col="1"
        ></div>
        <div
          class="cell"
          data-row="1"
          data-col="2"
        ></div>
        <div
          class="cell"
          data-row="1"
          data-col="3"
        ></div>

        <div
          class="cell"
          data-row="2"
          data-col="0"
        ></div>
        <div
          class="cell"
          data-row="2"
          data-col="1"
        ></div>
        <div
          class="cell"
          data-row="2"
          data-col="2"
        ></div>
        <div
          class="cell"
          data-row="2"
          data-col="3"
        ></div>

        <div
          class="cell"
          data-row="3"
          data-col="0"
        ></div>
        <div
          class="cell"
          data-row="3"
          data-col="1"
        ></div>
        <div
          class="cell"
          data-row="3"
          data-col="2"
        ></div>
        <div
          class="cell"
          data-row="3"
          data-col="3"
        ></div>
      </div>

      <p class="hint">
        Use arrow keys (← ↑ → ↓). After each move a 2 (90%) or 4 (10%) will
        appear.
      </p>
    </div>

    <script
      type="module"
      src="./scripts/main.js"
    ></script>
  </body>
</html>
